plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.designer'
version = '0.0.1-SNAPSHOT'
description = 'DeepSeek Harness - terminal chat client for DeepSeek'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(24)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "2.0.1")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.ai:spring-ai-starter-model-deepseek'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

// bootRun 默认不把终端交给程序，必须显式把 stdin 接进去，否则 ReadLine 立刻 EOF
tasks.named('bootRun') {
    standardInput = System.in
    if (java.toolchain.languageVersion.get().asInt() >= 24) {
        jvmArgs '--enable-native-access=ALL-UNNAMED', '--sun-misc-unsafe-memory-access=allow'
    }
}

tasks.named('bootJar') {
    archiveFileName = 'deepseek-harness.jar'
}

tasks.named('test') {
    useJUnitPlatform()
}
