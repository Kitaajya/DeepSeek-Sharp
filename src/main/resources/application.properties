spring.application.name=DeepSeek_Sharp
spring.main.banner-mode=off

# ---------- DeepSeek (Spring AI) ----------
spring.ai.deepseek.chat.options.model=deepseek-chat
# 也可以把 Key 直接写在这里（不推荐，容易跟着仓库提交出去）：
# spring.ai.deepseek.api-key=sk-xxxxxxxxxxxxxxxx

# ---------- MySQL：保存会话与消息 ----------
# createDatabaseIfNotExist=true 会自动建 deepseek_sharp 库；表在启动时由程序建
spring.datasource.url=jdbc:mysql://localhost:3306/deepseek_sharp?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
# MySQL 没开的时候不要让整个程序起不来：池子先不连，真正查询失败时再降级
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=4

# ---------- 本程序自己的设置 ----------
deepseek.history-limit=20

# ---------- 日志：终端里只留我们自己的输出 ----------
logging.level.root=WARN
logging.level.org.designer.deepseek_sharp=WARN
logging.level.org.springframework.ai=ERROR
# 401/429 时 Spring AI 会把整段堆栈打到日志里，这里关掉，交给 ChatErrorTranslator 翻译成一句人话
logging.level.org.springframework.ai.chat.model.MessageAggregator=OFF
logging.level.org.springframework.web.reactive.function.client=OFF
